[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Read access to the terms document the deploy scripts anchor. Read-write access to the deployment
# files the testnet deployment writes for the demo app (script/testnet/DeployTestnet.s.sol).
fs_permissions = [
    { access = "read", path = "./docs" },
    { access = "read-write", path = "./app/src/config/deployments" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Gas benchmarks are not tests: they are excluded here and run by the gas profile below. The testnet
# tooling tests are excluded too: script/ is compiled with every build, so without this the default
# run would pick them up and change the protocol's test count. The testnet profile runs them.
no_match_path = "{test/gas/*,script/testnet/test/*}"

# Gas benchmarks only: FOUNDRY_PROFILE=gas forge test --isolate --gas-report
#
# Every profile inherits the default's no_match_path, which would exclude the benchmarks here too.
# Forge offers no way to clear an inherited pattern: an empty string makes it match every path and
# no test runs. So this profile overrides it with test/scratch/*, the git-ignored directory for
# local scratch tests, which keeps those out of a benchmark run and excludes nothing tracked.
[profile.gas]
match_path = "test/gas/*"
no_match_path = "test/scratch/*"

# Testnet tooling (script/testnet): its own suite, so the protocol's test figures stay unchanged.
# FOUNDRY_PROFILE=testnet forge test
#
# Like the gas profile, it overrides the inherited no_match_path, which would exclude these tests.
[profile.testnet]
test = "script/testnet/test"
match_path = "script/testnet/test/*"
no_match_path = "test/scratch/*"

[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 128, fail_on_revert = false }

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false

# Matches the formatting already in the tree: forge fmt --check passes with no diff.
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
sort_imports = false
wrap_comments = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
