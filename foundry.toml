[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./docs" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Gas benchmarks are not tests: they are excluded here and run by the gas profile below.
no_match_path = "test/gas/*"

# Gas benchmarks only: FOUNDRY_PROFILE=gas forge test --isolate --gas-report
[profile.gas]
match_path = "test/gas/*"
no_match_path = "test/scratch/*"

[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 128, fail_on_revert = false }

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false

# Matches the formatting already in the tree: forge fmt --check passes with no diff.
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
sort_imports = false
wrap_comments = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
